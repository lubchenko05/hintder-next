name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Backend base — api.ts appends /api/v1 itself.
          NEXT_PUBLIC_API_URL: https://api.hintder.ai
          # Firebase WEB config is public by design (safe to inline) — needed at
          # build time because src/lib/firebase.ts reads it at module load.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCgbpL0LXHY72MS8BwpadZMxg90AcezuPA
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: login.hintder.ai
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: hintder-ai
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: hintder-ai.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '587342140966'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:587342140966:web:3df63298b393c89a9fb8e7
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-EV5E2RC9T9
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_9f58c79b520be573236d74d1765
          NEXT_PUBLIC_PADDLE_ENV: sandbox
